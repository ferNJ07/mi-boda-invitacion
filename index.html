<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            <h1 class="wedding-title">Fernando & Valeria</h1>
            <p class="wedding-subtitle">Estás invitado</p>
            <button id="btn-entrar" class="btn-elegant">Abrir Invitación</button>
        </div>
    </div>

    <main id="main-content" class="main-container hidden">
        
        <section class="video-section">
            <video id="wedding-video" width="100%" playsinline>
                <source src="assets/videos/tu_video.mp4" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </section>

        <section class="invitation-details">
            <h2>Nos Casamos</h2>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitación de Boda</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            <h1 class="wedding-title"></h1>
            <p class="wedding-subtitle"></p>
            <button id="btn-entrar" class="btn-elegant">Abrir Invitación</button>
        </div>
    </div>

    <main id="main-content" class="main-container hidden">
        
        <section id="video-fullscreen-container" class="video-fullscreen">
            <video id="wedding-video" playsinline muted autoplay loop preload="auto">
                <source src="assets/tu_video2.mp4" type="video/mp4">
                Tu navegador no soporta video.
            </video>
        </section>

        <div id="invitation-details" class="invitation-details hidden-content">
            <h2>Nos Casamos</h2>
            </div>

    </main>

    <script src="script.js"></script>
</body>
</html>

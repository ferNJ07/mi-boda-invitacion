<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            <h1 class="wedding-title">Fernando & Valeria</h1>
            <p class="wedding-subtitle">Estás invitado</p>
            <button id="btn-entrar" class="btn-elegant">Abrir Invitación</button>
        </div>
    </div>

    <main id="main-content" class="main-container hidden">
    
    <!-- Sección del Video configurada a Pantalla Completa Inicial -->
    <section id="video-fullscreen-container" class="video-fullscreen">
        <video id="wedding-video" playsinline preload="auto">
            <source src="assets/tu_video.mp4" type="video/mp4">
            Tu navegador no soporta video.
        </video>
    </section>

    <!-- La Invitación Real (Se revela al terminar el video) -->
    <div id="invitation-details" class="invitation-details hidden-content">
        <h2>Nos Casamos</h2>
        <!-- Aquí continuará el resto de la información -->
    </div>

</main>

    <script src="script.js"></script>
</body>
</html>
